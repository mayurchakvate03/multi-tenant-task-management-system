server:
  port: ${PORT:8080}

spring:
  application:
    name: multi-tenant-task-management-system
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # Override JWT_SECRET with a random base64-encoded key before deploying.
    secret: ${JWT_SECRET:VGVuYW50VG9rZW5TaWduaW5LZXlNYXRlcmlhbEZvckxvY2FsRGV2ZWxvcG1lbnRPbmx5}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
